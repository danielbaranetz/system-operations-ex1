version: '3.8'

services:
  app:
    build: ./app
    ports:
      - "8000:8000"
    volumes:
      - ./inventory.txt:/app/inventory.txt
      - ./.env:/app/.env

  proxy:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - app